<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário - João Vitor Oliveira da Silva</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <header class="cabeçalho">
        <h1>João Vitor</h1>

        <nav class="menu-navegador-principal">
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="curriculo.html">Currículo</a></li>
                <li><a href="formulario.html">Formulário</a></li>
                <li><a href="multimidia.html">Multimídia</a></li>
                <li><a href="graficos.html">Gráficos</a></li>
            </ul>
        </nav>
        <button type="button" id="btnTema">🌙 Tema escuro</button>
    </header>

    <main class="conteudo-pagina-menu">
        <h2>Fale comigo</h2>
        <div class="cards">
            <section class="card">
                <h3>Dados pessoais</h3>
                <form novalidate>
                    <fieldset>
                        <legend>Dados pessoais</legend>

                        <label for="nome">Nome:</label>
                        <input type="text" id="nome" name="nome" required>

                        <label for="email">E-mail:</label>
                        <input type="email" id="email" name="email" required>

                        <label for="senha">Senha:</label>
                        <input type="password" id="senha" name="senha" minlength="6" required>

                        <label for="tel">Telefone:</label>
                        <input type="tel" id="tel" name="tel" pattern="[0-9]{2}-[0-9]{5}-[0-9]{4}"
                            placeholder="11-91234-5678">

                        <label for="nasc">Nascimento:</label>
                        <input type="date" id="nasc" name="nasc">
                    </fieldset>

                    <fieldset>
                        <legend>Preferências</legend>

                        <label for="cor">Cor:</label>
                        <input type="color" id="cor" name="cor">

                        <label for="vol">Volume:</label>
                        <input type="range" id="vol" name="vol" min="0" max="100">
                    </fieldset>

                    <div id="mensagemForm" class="msg-form" role="alert"></div>
                    <button type="submit">Enviar</button>
                </form>
            </section>
        </div>
    </main>

    <footer class="main footer">
        <p class="footer text">Trabalho Individual - Site Pessoal / Portfólio - Desenvolvimento Front-end para Web.</p>
    </footer>

    <script src="js/scripts.js"></script>
</body>

</html>
