<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário - João Vitor Oliveira da Silva</title>
    <!-- Bootstrap 5.3.3 (CSS) carregado ANTES do meu CSS, para os meus estilos poderem sobrescrever -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <a class="visually-hidden-focusable skip-link" href="#conteudo">Pular para o conteúdo</a>

    <header>
        <nav class="navbar navbar-expand-md bg-black" data-bs-theme="dark" aria-label="Menu principal">
            <div class="container">
                <h1 class="navbar-brand mb-0">João Vitor</h1>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
                    aria-controls="menu" aria-expanded="false" aria-label="Abrir ou fechar o menu">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="menu">
                    <ul class="navbar-nav ms-auto mb-2 mb-md-0">
                        <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
                        <li class="nav-item"><a class="nav-link" href="curriculo.html">Currículo</a></li>
                        <li class="nav-item"><a class="nav-link active" href="formulario.html" aria-current="page">Formulário</a></li>
                        <li class="nav-item"><a class="nav-link" href="multimidia.html">Multimídia</a></li>
                        <li class="nav-item"><a class="nav-link" href="graficos.html">Gráficos</a></li>
                    </ul>
                    <button type="button" id="btnTema" class="btn btn-outline-light btn-sm ms-md-3">🌙 Tema escuro</button>
                </div>
            </div>
        </nav>
    </header>

    <main id="conteudo" class="conteudo-pagina-menu" tabindex="-1">
        <h2>Fale comigo</h2>
        <div class="row g-4">
            <div class="col-12 col-lg-8">
                <section class="card">
                    <h3>Entre em contato</h3>
                    <form novalidate>
                        <fieldset>
                            <legend>Dados pessoais</legend>

                            <label for="nome" class="form-label mt-2">Nome:</label>
                            <input type="text" id="nome" name="nome" class="form-control" autocomplete="name" required>

                            <label for="email" class="form-label mt-3">E-mail:</label>
                            <input type="email" id="email" name="email" class="form-control" autocomplete="email" required>

                            <label for="senha" class="form-label mt-3">Senha:</label>
                            <input type="password" id="senha" name="senha" class="form-control" minlength="6"
                                autocomplete="new-password" required>

                            <label for="tel" class="form-label mt-3">Telefone:</label>
                            <input type="tel" id="tel" name="tel" class="form-control" autocomplete="tel"
                                pattern="[0-9]{2}-[0-9]{5}-[0-9]{4}" placeholder="11-91234-5678">

                            <label for="nasc" class="form-label mt-3">Nascimento:</label>
                            <input type="date" id="nasc" name="nasc" class="form-control" autocomplete="bday">
                        </fieldset>

                        <fieldset>
                            <legend>Preferências</legend>

                            <label for="cor" class="form-label mt-2">Cor:</label>
                            <input type="color" id="cor" name="cor" class="form-control form-control-color">

                            <label for="vol" class="form-label mt-3">Volume:</label>
                            <input type="range" id="vol" name="vol" class="form-range" min="0" max="100">
                        </fieldset>

                        <div id="mensagemForm" class="msg-form" role="alert"></div>
                        <div class="d-grid d-sm-block mt-3">
                            <button type="submit" class="btn btn-dark">Enviar</button>
                        </div>
                    </form>
                </section>
            </div>
        </div>
    </main>
    <footer class="main footer">
        <p class="footer text">Trabalho Individual - Site Pessoal / Portfólio - Desenvolvimento Front-end para Web.</p>
    </footer>

    <!-- Bootstrap 5.3.3 (JS) para o menu hambúrguer; depois, o meu script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/scripts.js"></script>
</body>

</html>
